name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Formatting, go vet, race-enabled tests and the build.
      - run: nix flake check -L
      - run: nix build -L
      - run: ./result/bin/agent-auth --help
