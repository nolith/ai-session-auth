name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Format
        run: test -z "$(gofmt -l *.go)"
      - run: go vet ./...
      - run: go test -race -count=1 -v ./...
      - run: go build -o agent-auth .
