# Used by plain `treefmt` and by `nix fmt` (via treefmt.withConfig in flake.nix).
on-unmatched = "info"
tree-root-file = "flake.nix"

[formatter.gofmt]
command = "gofmt"
options = ["-w"]
includes = ["*.go"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

# Markdown, with the rules in .rumdl.toml: fixes what it can, and fails on
# what it cannot, so that nix flake check refuses it.
[formatter.rumdl]
command = "rumdl"
options = ["check", "--fix", "--no-cache"]
includes = ["*.md"]
